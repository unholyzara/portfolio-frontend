<div class="carousel" role="group" [attr.aria-roledescription]="t('Carousel')" [attr.aria-label]="label()">
  @if (canPrev() || canNext()) {
    <div class="carousel__controls">
      <button
        type="button"
        class="carousel__btn m"
        [attr.aria-label]="t('Previous')"
        [disabled]="!canPrev()"
        (click)="scroll(-1)"
      >
        ←
      </button>
      <button
        type="button"
        class="carousel__btn m"
        [attr.aria-label]="t('Next')"
        [disabled]="!canNext()"
        (click)="scroll(1)"
      >
        →
      </button>
    </div>
  }
  <ul class="carousel__track" #track (scroll)="update()">
    <ng-content />
  </ul>
</div>
