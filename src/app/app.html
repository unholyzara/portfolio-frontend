@if (settings.status().maintenance) {
  <app-maintenance />
} @else {
  <header class="nav m">
    <a class="nav__brand" routerLink="/">unholyzara.dev</a>
    <nav class="nav__links" [attr.aria-label]="t('Main')">
      <a href="/" (click)="scrollToSection('progetti', $event)">{{ t('Projects') }}</a>
      <a href="/" (click)="scrollToSection('esperienza', $event)">{{ t('Experience') }}</a>
      <a href="/" (click)="scrollToSection('formazione', $event)">{{ t('Education') }}</a>
      <a href="/" (click)="scrollToSection('contatti', $event)">{{ t('Contacts') }}</a>
      <button type="button" class="btn m" [attr.aria-label]="t('Change theme')" (click)="settings.toggleTheme()">
        <span [class.on]="settings.theme() === 'dark'">{{ t('Dark') }}</span>&nbsp;/&nbsp;<span
          [class.on]="settings.theme() === 'light'"
          >{{ t('Light') }}</span
        >
      </button>
      <button
        type="button"
        class="btn m"
        [attr.aria-label]="t('Change language')"
        (click)="settings.toggleLang()"
      >
        @for (lang of settings.languages; track lang) {
          <span [class.on]="settings.lang() === lang">{{ lang.toUpperCase() }}</span>

          @if (!$last) {
            &nbsp;/&nbsp;
          }
        }
      </button>
      @if (settings.status().maintenanceStatus) {
        <span class="tag tag--accent m">{{ t('Maintenance') }}</span>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="footer m muted">© unholyzara.dev</footer>
}
